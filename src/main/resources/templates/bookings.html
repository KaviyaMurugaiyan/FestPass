<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings - FestPass</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8f5;
            color: #1f2937;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #16803c;
            color: white;
            padding: 25px 18px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .logo span {
            color: #d9f99d;
        }

        .nav a {
            display: block;
            text-decoration: none;
            color: white;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 9px;
            font-size: 15px;
            transition: 0.2s;
        }

        .nav a:hover,
        .nav a.active {
            background: rgba(255, 255, 255, 0.18);
        }

        .logout {
            position: absolute;
            bottom: 25px;
            left: 18px;
            right: 18px;
        }

        .logout a {
            display: block;
            text-align: center;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 12px;
            border-radius: 8px;
        }

        /* MAIN */
        .main {
            margin-left: 250px;
            padding: 35px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            color: #14532d;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        /* BOOKINGS */
        .booking-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 22px;
        }

        .booking-card {
            background: white;
            border-radius: 15px;
            padding: 24px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
            border-top: 5px solid #16803c;
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .booking-header h2 {
            color: #14532d;
            font-size: 20px;
        }

        .status {
            background: #dcfce7;
            color: #166534;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .detail {
            margin-bottom: 12px;
        }

        .label {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .value {
            color: #1f2937;
            font-size: 15px;
            font-weight: 600;
        }

        .booking-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ticket-id {
            font-size: 12px;
            color: #6b7280;
        }

        .view-ticket {
            text-decoration: none;
            background: #16803c;
            color: white;
            padding: 9px 14px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
        }

        .view-ticket:hover {
            background: #126b32;
        }

        /* EMPTY / ERROR */
        .message {
            background: white;
            border-radius: 14px;
            padding: 45px;
            text-align: center;
            color: #6b7280;
            box-shadow: 0 5px 18px rgba(0,0,0,0.05);
        }

        .message h2 {
            color: #14532d;
            margin-bottom: 10px;
        }

        .book-now {
            display: inline-block;
            margin-top: 18px;
            text-decoration: none;
            background: #16803c;
            color: white;
            padding: 11px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {

            .sidebar {
                width: 210px;
            }

            .main {
                margin-left: 210px;
                padding: 20px;
            }

            .booking-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="logo">
        Fest<span>Pass</span>
    </div>

    <div class="nav">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/events">
            Events
        </a>

        <a href="/timings">
            Event Timings
        </a>

        <a href="/bookings" class="active">
            My Bookings
        </a>

        <a href="/tickets">
            My Tickets
        </a>

        <a href="/scanner">
            QR Check-in
        </a>

    </div>

    <div class="logout">
        <a href="/login" onclick="logout()">
            Logout
        </a>
    </div>

</div>


<!-- MAIN -->
<div class="main">

    <div class="header">
        <h1>My Bookings</h1>
        <p>View all the events you have booked.</p>
    </div>

    <div class="booking-list" id="bookingList">

        <div class="message">
            Loading your bookings...
        </div>

    </div>

</div>


<script>

    // Check login
    const loggedInEmail = localStorage.getItem("loggedInEmail");

    if (!loggedInEmail) {
        window.location.href = "/login";
    }


    // Load bookings
    async function loadBookings() {

        try {

            const response = await fetch(
                "/api/tickets/my-bookings?email=" +
                encodeURIComponent(loggedInEmail)
            );

            if (!response.ok) {
                throw new Error("Unable to fetch bookings");
            }

            const bookings = await response.json();

            const bookingList = document.getElementById("bookingList");

            bookingList.innerHTML = "";


            // No bookings
            if (!bookings || bookings.length === 0) {

                bookingList.innerHTML = `
                    <div class="message">

                        <h2>No Bookings Yet</h2>

                        <p>
                            You haven't booked any events yet.
                        </p>

                        <a href="/events" class="book-now">
                            Browse Events
                        </a>

                    </div>
                `;

                return;
            }


            // Display bookings
            bookings.forEach(ticket => {

                const event = ticket.event;
                const attendee = ticket.attendee;


                let formattedDate = "Date not available";

                if (event && event.eventDate) {

                    const date = new Date(
                        event.eventDate + "T00:00:00"
                    );

                    formattedDate = date.toLocaleDateString(
                        "en-IN",
                        {
                            day: "2-digit",
                            month: "short",
                            year: "numeric"
                        }
                    );
                }


                let startTime = event?.startTime
                    ? formatTime(event.startTime)
                    : "--";


                let endTime = event?.endTime
                    ? formatTime(event.endTime)
                    : "--";


                const card = document.createElement("div");

                card.className = "booking-card";


                card.innerHTML = `

                    <div class="booking-header">

                        <h2>
                            ${event?.name || "Event"}
                        </h2>

                        <span class="status">
                            ${ticket.used ? "USED" : "BOOKED"}
                        </span>

                    </div>


                    <div class="detail">

                        <div class="label">
                            Category
                        </div>

                        <div class="value">
                            ${event?.category || "Fest Event"}
                        </div>

                    </div>


                    <div class="detail">

                        <div class="label">
                            Date
                        </div>

                        <div class="value">
                            ${formattedDate}
                        </div>

                    </div>


                    <div class="detail">

                        <div class="label">
                            Time
                        </div>

                        <div class="value">
                            ${startTime} - ${endTime}
                        </div>

                    </div>


                    <div class="detail">

                        <div class="label">
                            Venue
                        </div>

                        <div class="value">
                            ${event?.venue || "Venue not available"}
                        </div>

                    </div>


                    <div class="detail">

                        <div class="label">
                            Attendee
                        </div>

                        <div class="value">
                            ${attendee?.name || "Student"}
                        </div>

                    </div>


                    <div class="booking-footer">

                        <div class="ticket-id">
                            Ticket #${ticket.id}
                        </div>

                        <a
                            href="/tickets?ticketId=${ticket.id}"
                            class="view-ticket"
                        >
                            View Ticket
                        </a>

                    </div>

                `;


                bookingList.appendChild(card);

            });


        } catch (error) {

            console.error(error);

            document.getElementById("bookingList").innerHTML = `

                <div class="message">

                    <h2>Unable to Load Bookings</h2>

                    <p>
                        Please make sure the Spring Boot server
                        is running and try again.
                    </p>

                </div>

            `;
        }
    }


    // Convert time
    function formatTime(time) {

        if (!time) {
            return "--";
        }

        const parts = time.split(":");

        let hours = parseInt(parts[0]);
        const minutes = parts[1];

        const ampm = hours >= 12 ? "PM" : "AM";

        hours = hours % 12;

        if (hours === 0) {
            hours = 12;
        }

        return `${hours}:${minutes} ${ampm}`;
    }


    // Logout
    function logout() {
        localStorage.removeItem("loggedInEmail");
    }


    // Start
    loadBookings();

</script>

</body>
</html>
