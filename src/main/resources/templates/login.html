<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FestPass | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f8f5;
        }

        .login-box {
            width: 400px;
            padding: 40px;
            background: white;
            border-radius: 18px;
            color: #1f2937;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #166534;
        }

        .logo span {
            color: #22c55e;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            background: #f9fafb;
            color: #111827;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #22c55e;
            background: white;
        }

        input::placeholder {
            color: #9ca3af;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #15803d;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #16a34a;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        Fest<span>Pass</span>
    </div>

    <p class="subtitle">
        Login to your account
    </p>

    <form onsubmit="login(event)">

        <label for="email">
            Email
        </label>

        <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
        >

        <label for="password">
            Password
        </label>

        <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Home
    </a>

</div>

<script>

    function login(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        if (email === "" || password === "") {

            alert("Please enter email and password.");

            return;
        }

        // Store the logged-in user's email
        localStorage.setItem("loggedInEmail", email);

        // Go to Dashboard
        window.location.href = "/dashboard";
    }

</script>

</body>
</html>
